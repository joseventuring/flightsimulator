name: Build installers

# Push a tag like v0.1.0 and this builds Mac (dmg), Windows (exe) and Linux (AppImage, deb)
# installers and attaches them to a GitHub Release. Run it by hand from the Actions tab too.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and publish to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: JG-Flight-Sim-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
